<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
    <title>Calendar - Google Calendar Style Display</title>
    <meta name="description" content="Fullscreen Google Calendar display optimized for 21.5-inch touchscreen kiosk mode on Raspberry Pi. Real-time calendar integration with day, week, and month views." />
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@300;400;500;700&display=swap" rel="stylesheet" />
    <style>
      /* Kiosk zoom policy (docs/decisions/0013): the page must never pinch
         or double-tap zoom — the layout is sized to the screen, and a zoomed
         visual viewport leaves it panning instead of fitting. Firefox
         desktop ignores the viewport meta's user-scalable=no, so this
         touch-action is the control that actually works there. NOT
         `manipulation`: that is an alias for `pan-x pan-y pinch-zoom` and
         still allows pinch zoom. Guarded by kiosk-zoom-policy.spec.ts. */
      html, body {
        touch-action: pan-x pan-y;
      }
      body {
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
      }
    </style>
    <!-- Theme boot cache: repaints the last applied theme before React
         mounts so a dark theme never flashes the light Default at boot.
         The cache is written by client/src/lib/theme-engine.ts applyTheme;
         data/config/dashboard.json remains the only source of truth and
         corrects this within one load. Only --rb-* keys with literal color
         values are ever applied. Tested by theme-boot-script.spec.ts. -->
    <script id="rb-theme-boot">
      (function () {
        try {
          var raw = localStorage.getItem("rootboard.theme-cache");
          if (!raw) return;
          var cache = JSON.parse(raw);
          var tokens = cache && cache.tokens;
          if (!tokens || typeof tokens !== "object") return;
          var NAME = /^--rb-[a-z0-9-]+$/;
          var COLOR = /^(#[0-9a-f]{6}([0-9a-f]{2})?|rgba?\(\s*\d{1,3}\s*,\s*\d{1,3}\s*,\s*\d{1,3}\s*(,\s*(0|1|0?\.\d+)\s*)?\))$/i;
          var style = document.documentElement.style;
          for (var key in tokens) {
            if (!Object.prototype.hasOwnProperty.call(tokens, key)) continue;
            var value = tokens[key];
            if (NAME.test(key) && typeof value === "string" && COLOR.test(value)) {
              style.setProperty(key, value);
            }
          }
        } catch (e) {
          /* best-effort; the config load will apply the real theme */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- This is a replit script which adds a banner on the top of the page when opened in development mode outside the replit environment -->
    <script type="text/javascript" src="https://replit.com/public/js/replit-dev-banner.js"></script>
  </body>
</html>
